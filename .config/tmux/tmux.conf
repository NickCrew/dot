# vim: ft=tmux foldmethod=marker
#
# Entry point. Sourced by ~/.tmux.conf.
#
# Load order matters:
#   1. settings        — terminal, mouse, history, base options
#   2. theme/colors    — palette vars; must precede statusbar/windows
#   3. theme/statusbar — active status bar styling
#   4. theme/windows   — pane and window styling
#   5. keybindings/*   — default key table (sets prefix), then F12 nested toggle
#   6. plugins         — TPM and plugin list; must be last per TPM convention

source-file ~/.config/tmux/settings.tmux

source-file ~/.config/tmux/theme/colors.tmux
source-file ~/.config/tmux/theme/statusbar.tmux
source-file ~/.config/tmux/theme/windows.tmux

source-file ~/.config/tmux/keybindings/default.tmux
source-file ~/.config/tmux/keybindings/nested.tmux
source-file ~/.config/tmux/keybindings/popups.tmux

source-file ~/.config/tmux/plugins.tmux
